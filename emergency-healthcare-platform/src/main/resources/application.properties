spring.application.name=emergency-healthcare-platform
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/emergency_healthcare?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=${SMTP_CONNECTION_TIMEOUT:3000}
spring.mail.properties.mail.smtp.timeout=${SMTP_TIMEOUT:3000}
spring.mail.properties.mail.smtp.writetimeout=${SMTP_WRITE_TIMEOUT:3000}

app.jwt.secret=${JWT_SECRET:change-this-development-secret-change-before-production}
app.jwt.expiration=${JWT_EXPIRATION:86400000}
app.sms.base-url=${SMS_BASE_URL:}
app.sms.traccar-token=${TRACCAR_TOKEN:}
app.sms.secret-key=${SMS_SECRET_KEY:}
app.sms.sender-id=${SMS_SENDER_ID:EMERG}
app.sms.mode=${SMS_MODE:SIMULATION}
app.frontend.origin=${FRONTEND_ORIGIN:http://localhost:5173}
